name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behavior
      placeholder: |
        1. Run `dakera ...`
        2. Send request to ...
        3. Observe error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened (include error messages or logs)
    validations:
      required: true
  - type: dropdown
    id: server_version
    attributes:
      label: Dakera server version
      description: Run `curl http://localhost:3000/health` and read `version`.
      options:
        - 0.12.0
        - 0.11.x
        - Older than 0.11
        - Not applicable (client-side issue only)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Client version
      description: SDK, CLI or MCP server version, if the issue involves one
      placeholder: "e.g. dakera-py 0.12.12, dk 0.7.1, dakera-mcp 0.10.12"
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment type
      options:
        - Docker (single node)
        - Docker Compose
        - Kubernetes / Helm
        - Cluster (multiple nodes)
        - Binary on a host
        - Built from source
        - Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
        - Docker
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other relevant information (config, environment, etc.)
