name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
      placeholder: "I'm always frustrated when ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Dakera does this relate to?
      options:
        - Core Engine
        - Python SDK
        - JavaScript SDK
        - Go SDK
        - Rust SDK
        - CLI
        - MCP Server
        - Dashboard
        - Documentation
        - Other
    validations:
      required: true
  - type: dropdown
    id: server_version
    attributes:
      label: Dakera server version you use
      options:
        - 0.12.0
        - 0.11.x
        - Not applicable
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment type
      options:
        - Docker (single node)
        - Docker Compose
        - Kubernetes / Helm
        - Cluster (multiple nodes)
        - Binary on a host
        - Not applicable
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other relevant information, mockups, or examples
